apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "front-end.fullname" . }}-netpol
  labels:
    {{- include "front-end.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "front-end.selectorLabels" . | nindent 6 }}
  
  policyTypes:
    - Ingress
    - Egress
  
  ingress:
    # Allow from anywhere (internet via LoadBalancer)
    - from: []
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  
  egress:
    # Allow to user-service
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: user-service
      ports:
        - protocol: TCP
          port: 3001
    
    # Allow to task-service
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: task-service
      ports:
        - protocol: TCP
          port: 3002
    
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53