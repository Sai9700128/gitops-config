apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "task-service.fullname" . }}-netpol
  labels:
    {{- include "task-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "task-service.selectorLabels" . | nindent 6 }}
  
  policyTypes:
    - Ingress
    - Egress
  
  ingress:
    # Allow from frontend
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: front-end
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  
  egress:
    # Allow to RDS (within VPC only)
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16    # ← Replace with your CIDR
      ports:
        - protocol: TCP
          port: 3306
    
    # Allow to user-service (user validation)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: user-service
      ports:
        - protocol: TCP
          port: 3001
    
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53