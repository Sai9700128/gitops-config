apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRegistries
metadata:
  name: only-allowed-registries
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    namespaces:             # Only apply this constraint to the "default" namespace
      - "default"
      # This below code is to exclude certain namespaces from this constraint, if you want to apply this constraint to all namespaces, just comment out the "namespaces" field and uncomment the "excludedNamespaces" field and add the namespaces you want to exclude.
    # excludedNamespaces:
    #   - kube-system
    #   - argocd
    #   - gatekeeper-system
    #   - vault
  parameters:
    registries:
      - "599138915215.dkr.ecr.us-east-1.amazonaws.com"
